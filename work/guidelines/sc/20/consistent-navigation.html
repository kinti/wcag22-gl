   <h4>Navegación Consistente</h4>
   
   <p class="conformance-level">AA</p>
   
   <p>Os mecanismos de navegación que se repiten en múltiples <a href="#dfn-web-page-s">páxinas web</a> dentro dun <a href="#dfn-set-of-web-pages">conxunto de páxinas web</a> ocorren na <a href="#dfn-same-relative-order">mesma orde relativa</a> cada vez que se repiten, agás se o cambio o inicia a persoa usuaria.
   </p>
