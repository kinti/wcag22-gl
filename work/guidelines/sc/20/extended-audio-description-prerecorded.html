<section id="extended-audio-description-prerecorded" class="sc">
   
   <h4>Audiodescrición Estendida (Pregravado)</h4>
   
   <p class="conformance-level">AAA</p>
   
   <p>Cando as pausas no audio do primeiro plano non son suficientes para que as <a href="#dfn-audio-descriptions">audiodescricións</a> transmitan o sentido do vídeo, proporciónase unha <a href="#dfn-extended-audio-description">audiodescrición estendida</a> para todo o contido de <a href="#dfn-video">vídeo</a> <a href="#dfn-prerecorded">pregravado</a> nos <a href="#dfn-synchronized-media">medios sincronizados</a>.
   </p>
   
</section>
