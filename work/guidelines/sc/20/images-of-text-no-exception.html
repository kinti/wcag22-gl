<section id="images-of-text-no-exception" class="sc">
   
   <h4>Imaxes de Texto (Sen Excepción)</h4>
   
   <p class="conformance-level">AAA</p>
   
   <p>As <a href="#dfn-images-of-text">imaxes de texto</a> úsanse só como <a href="#dfn-pure-decoration">decoración pura</a> ou cando unha presentación específica do <a href="#dfn-text">texto</a> é <a href="#dfn-essential">esencial</a> para a información que se transmite.
   </p>
   
   <p class="note">Os logotipos (texto que forma parte dun logotipo ou dun nome de marca) considéranse esenciais.</p>
   
</section>
