<section id="language-of-parts" class="sc">
   
   <h4>Lingua das Partes</h4>
   
   <p class="conformance-level">AA</p>
   
   <p>A <a href="#dfn-human-language-s">lingua humana</a> de cada pasaxe ou frase do contido pode ser <a href="#dfn-programmatically-determinable">determinada programaticamente</a> agás para os nomes propios, os termos técnicos, as palabras de lingua indeterminada e as palabras
      ou frases que pasaron a formar parte do vernáculo do <a href="#dfn-text">texto</a> inmediato que
     as rodea.
   </p>
   
</section>
