<section id="no-timing" class="sc">
   
   <h4>Sen Temporización</h4>
   
   <p class="conformance-level">AAA</p>
   
   <p>A temporización non é unha parte <a href="#dfn-essential">esencial</a> do evento ou actividade presentada polo contido, agás para os <a href="#dfn-synchronized-media">medios sincronizados</a> non interactivos
      e os <a href="#dfn-real-time-events">eventos en tempo real</a>.
   </p>
   
</section>
