<section id="label-in-name" class="sc">
   <h4>Etiqueta no Nome</h4>
   <p class="conformance-level">A</p>
	
  <p>Para os <a href="#dfn-user-interface-components">compoñentes da interfaz de usuario</a> con <a href="#dfn-labels">etiquetas</a> que inclúen <a href="#dfn-text">texto</a> ou <a href="#dfn-images-of-text">imaxes de texto</a>, o <a href="#dfn-name">nome</a> contén o texto que se presenta visualmente.</p>

  <p class="note">Unha boa práctica é que o texto da etiqueta estea ao inicio do nome.</p>
	
</section>
