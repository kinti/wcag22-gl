<section id="status-messages" class="sc">
   					
   <h4>Mensaxes de Estado</h4>
   					
   <p class="conformance-level">AA</p>
   					
   <p>No contido implementado usando linguaxes de marcado, as <a href="#dfn-status-messages">mensaxes de estado</a> poden ser <a href="#dfn-programmatically-determinable">determinadas programaticamente</a> a través da <a href="#dfn-role">función</a> ou de propiedades, de xeito que poidan presentarse á persoa usuaria polas <a href="#dfn-assistive-technologies">tecnoloxías de asistencia</a> sen recibir o foco.</p>
