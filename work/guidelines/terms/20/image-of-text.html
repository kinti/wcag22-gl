<dt><dfn id="dfn-images-of-text" data-lt="images of text">imaxe de texto</dfn></dt>
<dd>
   
  <p>texto que foi renderizado nunha forma non textual (por exemplo, unha imaxe) para acadar
      un efecto visual particular
   </p>
   
   <p class="note">Isto non inclúe o texto que forma parte dunha imaxe que contén outro contido visual significativo.
   </p>
   
   <aside class="example"><p>O nome dunha persoa nunha etiqueta nunha fotografía.</p></aside>
   
</dd>
