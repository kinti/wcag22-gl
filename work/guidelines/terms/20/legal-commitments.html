<dt><dfn id="dfn-legal-commitments">compromisos legais</dfn></dt>
<dd>
   
   <p>transaccións nas que a persoa incorre nunha obriga ou beneficio legalmente vinculante</p>
   
   <aside class="example"><p>Unha licenza de matrimonio, unha operación de bolsa (financeira e legal), un testamento, un préstamo, unha adopción,
      alistarse no exército, un contrato de calquera tipo, etc.
   </p></aside>
   
</dd>
