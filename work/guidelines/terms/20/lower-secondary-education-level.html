<dt><dfn id="dfn-lower-secondary-education-level">nivel de educación secundaria inferior</dfn></dt>
<dd>
   
   <p>o período de dous ou tres anos de educación que comeza tras completar seis anos
      de escola e termina nove anos despois do inicio da <a href="#dfn-primary-education">educación primaria</a></p>
   
   <p class="note">Esta definición baséase na Clasificación Internacional Normalizada da Educación
      [[UNESCO]].
   </p>
   
</dd>
