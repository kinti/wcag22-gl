<dt><dfn id="dfn-primary-education" data-lt="primary education">nivel de educación primaria</dfn></dt>
<dd>
   
   <p>período de seis anos que comeza entre os cinco e os sete anos de idade, posiblemente sen
      ningunha educación previa
   </p>
   
   <p class="note">Esta definición baséase na Clasificación Internacional Normalizada da Educación
      [[UNESCO]].
   </p>
   
</dd>
