<dt><dfn id="dfn-pure-decoration">decoración pura</dfn></dt>
<dd>
   
   <p>serve só un propósito estético, non proporciona información e non ten funcionalidade</p>
   
   <p class="note">O texto é só puramente decorativo se as palabras se poden reordenar ou substituír sen
      cambiar o seu propósito.
   </p>
   
   <aside class="example"><p>A portada dun dicionario ten palabras aleatorias en texto moi claro no fondo.</p></aside>
   
</dd>
