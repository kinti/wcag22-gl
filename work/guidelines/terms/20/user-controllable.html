<dt><dfn id="dfn-user-controllable">controlable polo usuario</dfn></dt>
<dd>
   
   <p>datos que están pensados para ser accedidos polas persoas usuarias</p>
   
   <p class="note">Isto non se refire a cousas como rexistros de Internet ou datos de monitorización de motores de busca.</p>
   
   <aside class="example"><p>Campos de nome e enderezo da conta dunha persoa usuaria.</p></aside>
   
</dd>
