<dt><dfn id="dfn-pointer-inputs" data-lt="pointer inputs">entrada de punteiro</dfn></dt>
<dd>
   					
   <p>entrada dun dispositivo que pode apuntar a unha coordenada específica (ou conxunto de coordenadas) nunha pantalla,
      como un rato, un bolígrafo ou un contacto táctil
   </p>
   <p class="note">Véxase a <a href="https://www.w3.org/TR/pointerevents/#dfn-pointer" lang="en">Pointer Events
      definition for "pointer"</a> [[pointerevents]].</p>
   				
</dd>
