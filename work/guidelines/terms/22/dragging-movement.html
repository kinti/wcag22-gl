<dt class="new"><dfn id="dfn-dragging-movements" data-lt="dragging movements">movemento de arrastre</dfn></dt>
<dd class="new">
	<p class="change">Novo</p>
   					
  <p>unha operación na que o punteiro se acopla a un elemento no <a href="#dfn-down-event">down-event</a> e o elemento (ou unha representación da súa posición) segue ao punteiro ata un <a href="#dfn-up-event">up-event</a></p>
   
   <p class="note">Exemplos de elementos arrastrables son os elementos de lista, os elementos de texto e as imaxes.</p>
</dd>
